name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install GTK (rfd file dialogs)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release
      - uses: actions/upload-artifact@v4
        with:
          name: buildcast-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/release/buildcast
            target/release/buildcast.exe
            target/release/buildcast-cli
            target/release/buildcast-cli.exe
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\windows\buildcast.iss
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: buildcast-installer
          if-no-files-found: error
          path: installer/windows/Output/*.exe
