name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches workspace version
        shell: bash
        run: |
          ver=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          test "v$ver" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME != Cargo.toml version $ver"; exit 1; }
      - uses: Swatinem/rust-cache@v2
        with:
          # same key as CI so tag runs hit the caches saved on main
          shared-key: build
          # tag-ref caches are never restorable by later tags; restore main, save nothing
          save-if: false
      - run: cargo build --workspace --release
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\windows\buildcast.iss
      - name: Zip portable binaries
        shell: pwsh
        run: |
          Compress-Archive -Path target\release\buildcast.exe, target\release\buildcast-cli.exe `
            -DestinationPath "buildcast-${env:GITHUB_REF_NAME}-windows-x86_64.zip"
      - name: Copy SBOM
        shell: bash
        run: |
          cp "$(find target/release/build -path '*/buildcast-*/out/sbom.cdx.json' | head -n 1)" \
            "buildcast-${GITHUB_REF_NAME}-windows-x86_64.cdx.json"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          if-no-files-found: error
          path: |
            installer/windows/Output/*.exe
            buildcast-*-windows-x86_64.zip
            buildcast-*.cdx.json

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches workspace version
        run: |
          ver=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          test "v$ver" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME != Cargo.toml version $ver"; exit 1; }
      - uses: Swatinem/rust-cache@v2
        with:
          # same key as CI so tag runs hit the caches saved on main
          shared-key: build
          # tag-ref caches are never restorable by later tags; restore main, save nothing
          save-if: false
      - run: cargo build --workspace --release
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - run: cargo deb -p buildcast --no-build
      - name: Tar portable binaries
        run: |
          tar czf "buildcast-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" \
            -C target/release buildcast buildcast-cli
      - name: Copy SBOM
        shell: bash
        run: |
          cp "$(find target/release/build -path '*/buildcast-*/out/sbom.cdx.json' | head -n 1)" \
            "buildcast-${GITHUB_REF_NAME}-linux-x86_64.cdx.json"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          if-no-files-found: error
          path: |
            target/debian/*.deb
            buildcast-*-linux-x86_64.tar.gz
            buildcast-*.cdx.json

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches workspace version
        run: |
          ver=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          test "v$ver" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME != Cargo.toml version $ver"; exit 1; }
      - uses: Swatinem/rust-cache@v2
        with:
          # same key as CI so tag runs hit the caches saved on main
          shared-key: build
          # tag-ref caches are never restorable by later tags; restore main, save nothing
          save-if: false
      - run: cargo build --workspace --release
      - run: bash installer/macos/make_bundle.sh "${GITHUB_REF_NAME#v}"
      - name: Copy SBOM
        shell: bash
        run: |
          cp "$(find target/release/build -path '*/buildcast-*/out/sbom.cdx.json' | head -n 1)" \
            "buildcast-${GITHUB_REF_NAME}-macos.cdx.json"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          if-no-files-found: error
          path: |
            target/release/*.dmg
            buildcast-*.cdx.json

  release:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            /^## \[/ { p = index($0, "[" v "]") > 0; next }
            /^\[/ { p = 0 }
            p
          ' CHANGELOG.md > notes.md
          grep -q . notes.md || { echo "CHANGELOG.md has no section for $GITHUB_REF_NAME"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/**/*.exe
            dist/**/*.zip
            dist/**/*.deb
            dist/**/*.tar.gz
            dist/**/*.dmg
            dist/**/*.cdx.json
          body_path: notes.md
