[package]
name = "buildcast-cli"
version.workspace = true
edition.workspace = true
description = "CLI for writing disk images to drives, with optional .bmap mapped-block flashing"
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
buildcast-core = { workspace = true }
indicatif = { workspace = true, features = ["unicode-width"] }

[dependencies.clap]
workspace = true
features = [
    "color",
    "derive",
    "error-context",
    "help",
    "std",
    "suggestions",
    "usage",
]

[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = ["Win32_Foundation", "Win32_System_Console"]

[build-dependencies]
embed-manifest = { workspace = true }
winresource = { workspace = true, features = ["toml"] }
