[package]
name = "buildcast"
version.workspace = true
edition.workspace = true
description = "Write compressed disk images to USB drives and create backups."
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "buildcast_gui"

[dependencies]
buildcast-core = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
dirs = { workspace = true }
egui = { workspace = true }
raw-window-handle = { workspace = true }
rfd = { workspace = true, features = ["wayland", "xdg-portal"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
ureq = { workspace = true, features = ["gzip", "rustls"] }

# glow instead of the default wgpu renderer saves about 8 MB
[dependencies.eframe]
workspace = true
features = ["accesskit", "default_fonts", "glow", "wayland", "x11"]

[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-manifest = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
winresource = { workspace = true, features = ["toml"] }

[package.metadata.deb]
name = "buildcast"
section = "utils"
depends = "$auto"
assets = [
    ["target/release/buildcast", "usr/bin/", "755"],
    ["target/release/buildcast-cli", "usr/bin/", "755"],
    ["assets/buildcast-256.png", "usr/share/icons/hicolor/256x256/apps/buildcast.png", "644"],
    ["../../installer/linux/buildcast.desktop", "usr/share/applications/", "644"],
]
