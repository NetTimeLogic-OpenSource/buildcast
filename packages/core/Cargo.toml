[package]
name = "buildcast-core"
version.workspace = true
edition.workspace = true
description = "Disk, stream and bmap core shared by the BuildCast GUI and CLI"
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
bzip2 = { workspace = true, features = ["default"] }
flate2 = { workspace = true, features = ["rust_backend"] }
liblzma = { workspace = true, features = ["static"] }
quick-xml = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true, features = ["std"] }
zstd = { workspace = true, features = ["legacy"] }

[target.'cfg(target_os = "macos")'.dependencies]
plist = { workspace = true, features = ["serde"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
]
