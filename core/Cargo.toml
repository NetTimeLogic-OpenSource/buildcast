[package]
name = "buildcast-core"
version = "0.1.0"
edition = "2021"
description = "Disk/stream/bmap core shared by the BuildCast GUI and CLI"
license = "MIT"

[dependencies]
flate2 = "1"
bzip2 = "0.5"
liblzma = { version = "0.4", features = ["static"] }
zstd = "0.13"
quick-xml = "0.37"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
    "Win32_Security",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
