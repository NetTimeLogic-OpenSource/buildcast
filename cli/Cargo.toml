[package]
name = "buildcast-cli"
version = "0.1.0"
edition = "2021"
description = "CLI for writing disk images to drives, with optional .bmap mapped-block flashing"
license = "MIT"

# no unit tests in the bin; all tests live in buildcast-core
[[bin]]
name = "buildcast-cli"
path = "src/main.rs"
test = false

[dependencies]
buildcast-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console"] }

[build-dependencies]
embed-manifest = "1.4"
winresource = "0.1"
