[package]
name = "buildcast-cli"
version.workspace = true
edition.workspace = true
description = "CLI for writing disk images to drives, with optional .bmap mapped-block flashing"
license.workspace = true

# no unit tests in the bin; all tests live in buildcast-core
[[bin]]
name = "buildcast-cli"
path = "src/main.rs"
test = false

[dependencies]
buildcast-core = { path = "../core" }
clap = { version = "4.6.5", features = ["derive"] }
indicatif = "0.18.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }

[build-dependencies]
embed-manifest = "1.5.0"
winresource = "0.1.31"
