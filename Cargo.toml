[workspace]
members = ["packages/cli", "packages/core", "packages/gui"]
resolver = "2"

# single source of truth for the app version
[workspace.package]
version = "0.1.7"
edition = "2024"
license = "MIT"
# highest requirement in the tree (egui 0.37), checked by the CI msrv job
rust-version = "1.95"

[workspace.dependencies]
buildcast-core = { path = "packages/core" }

bzip2 = { version = "0.6.1", default-features = false }
chrono = { version = "0.4.45", default-features = false }
clap = { version = "4.6.7", default-features = false }
dirs = { version = "7.0.0", default-features = false }
eframe = { version = "0.37.0", default-features = false }
egui = { version = "0.37.0", default-features = false }
embed-manifest = { version = "1.5.1", default-features = false }
flate2 = { version = "1.1.10", default-features = false }
indicatif = { version = "0.18.6", default-features = false }
libc = { version = "0.2.189", default-features = false }
liblzma = { version = "0.4.9", default-features = false }
plist = { version = "1.10.3", default-features = false }
quick-xml = { version = "0.42.0", default-features = false }
raw-window-handle = { version = "0.6.2", default-features = false }
rfd = { version = "0.17.2", default-features = false }
serde_json = { version = "1.0.154", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
thiserror = { version = "2.0.21", default-features = false }
ureq = { version = "3.5.0", default-features = false }
windows-sys = { version = "0.61.2", default-features = false }
winresource = { version = "0.1.34", default-features = false }
zstd = { version = "0.14.3", default-features = false }

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
arbitrary_source_item_ordering = "warn"
mod_module_files = "warn"

[profile.release]
lto = true
strip = true
opt-level = 3
